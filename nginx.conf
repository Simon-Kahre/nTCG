server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Godot HTML5
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Go backend
    location /login {
        proxy_pass http://login:4000/login;
    }

    location /oidcc/ {
        proxy_pass http://login:4000/oidcc/;
    }

    location /me {
        proxy_pass http://login:4000/me;
    }

    location /socket {
        proxy_pass http://websocket:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}