services:
  game:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - login
      - websocket

  login:
    build: ./login
    expose:
      - "4000"
    environment:
      SSO_ADDRESS: localhost
      SSO_PORT: 1339
      GAME_ADDRESS: localhost
      GAME_PORT: 8080
      LOGIN_PORT: 4000

  websocket:
    build: ./websocket
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fooAccounts
      DB_USER: postgres
      DB_PASSWORD: password
      SERVER_PORT: 3000
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: game-postgres
    environment:
      POSTGRES_DB: fooAccounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: